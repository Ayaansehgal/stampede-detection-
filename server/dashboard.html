<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampede Detection — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f0f14;
            --surface: #18181f;
            --surface-hover: #1e1e28;
            --border: #2d2d3a;
            --text: #f0f0f5;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --safe: #10b981;
            --safe-bg: rgba(16, 185, 129, 0.12);
            --elevated: #f59e0b;
            --elevated-bg: rgba(245, 158, 11, 0.12);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --accent: #6366f1;
            --radius: 12px;
            --space: 24px;
            --max-width: 1280px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: var(--space);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .layout {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .header-left p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
        }
        .live-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .live-pill.live .dot {
            background: var(--safe);
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* KPI row — 3 cards */
        .kpi-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: var(--space);
        }
        @media (max-width: 768px) {
            .kpi-row { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: border-color 0.2s, background 0.2s;
        }
        .card:hover { background: var(--surface-hover); }

        .card-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .card-status .label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .card-status .value {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .card-status.WAITING .value { color: var(--text-muted); }
        .card-status.BUFFERING .value { color: var(--elevated); }
        .card-status.SAFE .value { color: var(--safe); }
        .card-status.ELEVATED .value { color: var(--elevated); }
        .card-status.SHOCKWAVE .value { color: var(--danger); }
        .card-status .risk-bar-mini {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 12px;
        }
        .card-status .risk-bar-mini span {
            display: block;
            height: 100%;
            border-radius: 999px;
            transition: width 0.35s ease, background 0.3s ease;
        }

        .card-kpi .label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .card-kpi .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text);
        }
        .card-kpi .value.accent { color: var(--accent); }

        /* Chart section */
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
        }
        .chart-card .card-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .chart-card .card-desc {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .chart-wrap {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* Event log */
        .events-section .card-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .events-section .card-desc {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .log-wrap {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
        }
        .log-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
        .log-wrap::-webkit-scrollbar-track { background: transparent; }
        .log-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 16px;
            text-align: left;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
        }
        .log-table td {
            padding: 10px 16px;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }
        .log-table tbody tr:hover td { background: var(--surface-hover); }
        .log-table .cell-status { font-weight: 600; }
        .log-table .cell-hash {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="layout">
        <header class="header">
            <div class="header-left">
                <h1>Stampede Detection</h1>
                <p>Real-time crowd risk · Density, velocity &amp; audio fusion</p>
            </div>
            <div class="header-right">
                <span id="live-pill" class="live-pill">
                    <span class="dot"></span>
                    Live
                </span>
            </div>
        </header>

        <div class="kpi-row">
            <div class="card">
                <div id="status-card" class="card-status WAITING">
                    <div>
                        <div class="label">Current status</div>
                        <div id="current-status" class="value">WAITING</div>
                        <div class="risk-bar-mini">
                            <span id="risk-bar" style="width: 0%; background: var(--border);"></span>
                        </div>
                    </div>
                    <div id="risk-value" class="value" style="font-size: 1.5rem;">0.00</div>
                </div>
            </div>
            <div class="card card-kpi">
                <div class="label">Risk score</div>
                <div id="risk-num" class="value">0.00</div>
            </div>
            <div class="card card-kpi">
                <div class="label">Events logged</div>
                <div id="event-count" class="value accent">0</div>
            </div>
        </div>

        <div class="chart-card">
            <div class="card-title">Risk over time</div>
            <div class="card-desc">Rolling risk score from the last 2 minutes</div>
            <div class="chart-wrap">
                <canvas id="risk-chart"></canvas>
            </div>
        </div>

        <section class="events-section">
            <div class="card-title">Event log</div>
            <div class="card-desc">State transitions and alerts (blockchain-backed)</div>
            <div class="log-wrap">
                <table class="log-table" id="events-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Risk</th>
                            <th>Hash</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const LIVE_TIMEOUT_MS = 5000;
        const RISK_HISTORY_MAX = 120;
        let lastEventTime = 0;
        let riskHistory = [];
        let riskChart = null;

        function getColor(label) {
            if (label === 'SHOCKWAVE') return '#ef4444';
            if (label === 'ELEVATED') return '#f59e0b';
            return '#10b981';
        }

        function riskBarColor(score) {
            if (score > 0.7) return 'var(--danger)';
            if (score > 0.4) return 'var(--elevated)';
            return 'var(--safe)';
        }

        function initChart() {
            const ctx = document.getElementById('risk-chart').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 220);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.35)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');

            riskChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Risk',
                        data: [],
                        borderColor: '#6366f1',
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e1e28',
                            titleColor: '#f0f0f5',
                            bodyColor: '#a0a0b0',
                            borderColor: '#2d2d3a',
                            borderWidth: 1,
                            callbacks: {
                                label: (item) => 'Risk: ' + Number(item.raw).toFixed(2)
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(45, 45, 58, 0.5)' },
                            ticks: {
                                color: '#6b6b7b',
                                maxTicksLimit: 8,
                                font: { size: 11 },
                                callback: (_, i, arr) => {
                                    if (arr.length < 10) return null;
                                    const idx = riskHistory.length - 1 - i;
                                    if (idx < 0) return '';
                                    const t = riskHistory[idx]?.t;
                                    if (!t) return '';
                                    const d = new Date(t * 1000);
                                    return d.toLocaleTimeString([], { minute: '2-digit', second: '2-digit' });
                                }
                            }
                        },
                        y: {
                            min: 0,
                            max: 1,
                            grid: { color: 'rgba(45, 45, 58, 0.5)' },
                            ticks: {
                                color: '#6b6b7b',
                                stepSize: 0.25,
                                font: { size: 11 },
                                callback: (v) => v.toFixed(2)
                            }
                        }
                    }
                }
            });
        }

        function pushRisk(score, t) {
            riskHistory.push({ score, t });
            if (riskHistory.length > RISK_HISTORY_MAX) riskHistory.shift();
            if (!riskChart) return;
            riskChart.data.labels = riskHistory.map((_, i) => i);
            riskChart.data.datasets[0].data = riskHistory.map(r => r.score);
            riskChart.update('none');
        }

        async function fetchStatus() {
            try {
                const r = await fetch('/status');
                const s = await r.json();
                lastEventTime = Date.now();
                const label = s.label || 'WAITING';
                const score = Math.min(1, Math.max(0, s.risk_score || 0));
                const ts = s.timestamp || Date.now() / 1000;

                document.getElementById('current-status').textContent = label;
                document.getElementById('status-card').className = 'card-status ' + label;
                document.getElementById('risk-bar').style.width = (score * 100).toFixed(0) + '%';
                document.getElementById('risk-bar').style.background = riskBarColor(score);
                document.getElementById('risk-value').textContent = score.toFixed(2);
                document.getElementById('risk-value').style.color = getColor(label);
                document.getElementById('risk-num').textContent = score.toFixed(2);
                document.getElementById('risk-num').style.color = getColor(label);
                document.getElementById('live-pill').classList.add('live');

                pushRisk(score, ts);
            } catch (e) {
                document.getElementById('live-pill').classList.remove('live');
            }
        }

        async function fetchEvents() {
            try {
                const response = await fetch('/events');
                const events = await response.json();
                if (Date.now() - lastEventTime > LIVE_TIMEOUT_MS) {
                    document.getElementById('live-pill').classList.remove('live');
                }
                document.getElementById('event-count').textContent = String(events.length);

                const tbody = document.querySelector('#events-table tbody');
                tbody.innerHTML = '';
                events.slice().reverse().slice(0, 50).forEach(event => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${new Date(event.timestamp * 1000).toLocaleTimeString()}</td>
                        <td class="cell-status" style="color: ${getColor(event.label)}">${event.label}</td>
                        <td>${event.risk_score.toFixed(2)}</td>
                        <td class="cell-hash">${(event.hash || '').substring(0, 12)}…</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {}
        }

        initChart();
        setInterval(fetchStatus, 400);
        setInterval(fetchEvents, 1500);
        fetchStatus();
        fetchEvents();
    </script>
</body>
</html>
